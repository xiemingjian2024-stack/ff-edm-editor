<svg width="1440" height="820" viewBox="0 0 1440 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E5F4"/>
      <stop offset="0.36" stop-color="#AFC4DA"/>
      <stop offset="0.68" stop-color="#E8D7C1"/>
      <stop offset="1" stop-color="#6F7D65"/>
    </linearGradient>
    <linearGradient id="blank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <style>
      .bg { fill: #F4F6FA; }
      .panel { fill: #FFFFFF; filter: url(#shadow); }
      .title { font: 700 24px Inter, Arial, sans-serif; fill: #273142; }
      .label { font: 600 15px Inter, Arial, sans-serif; fill: #768296; }
      .muted { font: 500 17px Inter, Arial, sans-serif; fill: #8792A4; }
      .strong { font: 700 17px Inter, Arial, sans-serif; fill: #1F2937; }
      .button { fill: #C8D6EE; }
      .buttonText { font: 700 16px Inter, Arial, sans-serif; fill: #1F2937; }
      .note { font: 500 15px Inter, Arial, sans-serif; fill: #8A94A6; }
      .caption { font: 700 18px Inter, Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="820"/>

  <text x="120" y="80" class="caption">空状态：只保留必要入口</text>
  <text x="780" y="80" class="caption">已有图片：编辑操作收进 hover 浮层</text>

  <!-- Empty state panel -->
  <rect x="90" y="112" width="560" height="560" rx="0" class="panel"/>
  <text x="122" y="160" class="title">图片</text>
  <path d="M594 153L606 165L618 153" stroke="#8A94A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="122" y="196" width="496" height="392" rx="10" fill="#F8FAFC" stroke="#DDE4EF" stroke-width="3"/>
  <rect x="150" y="232" width="440" height="216" rx="0" fill="url(#blank)"/>
  <text x="286" y="347" class="muted">＋ 上传图片</text>

  <rect x="150" y="484" width="296" height="48" rx="8" fill="#FFFFFF" stroke="#DDE4EF" stroke-width="2"/>
  <text x="170" y="514" class="note">粘贴 Shopify / 图片链接</text>
  <rect x="446" y="484" width="118" height="48" rx="6" class="button"/>
  <text x="468" y="514" class="buttonText">从链接获取</text>
  <rect x="580" y="484" width="62" height="48" rx="6" class="button" transform="translate(-24 0)"/>
  <text x="574" y="514" class="buttonText">粘贴</text>

  <text x="122" y="620" class="note">默认不出现缩放 / 重置，减少第一眼复杂度</text>

  <!-- Filled state panel -->
  <rect x="750" y="112" width="560" height="560" rx="0" class="panel"/>
  <text x="782" y="160" class="title">图片</text>
  <path d="M1254 153L1266 165L1278 153" stroke="#8A94A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="782" y="196" width="496" height="392" rx="10" fill="#F8FAFC" stroke="#DDE4EF" stroke-width="3"/>
  <rect x="810" y="232" width="440" height="216" rx="0" fill="url(#photo)"/>
  <path d="M810 420C875 360 930 360 1000 415C1068 468 1165 450 1250 380V448H810V420Z" fill="#5E6A4E" opacity="0.55"/>
  <path d="M810 274C900 220 1005 260 1085 236C1153 216 1198 222 1250 250V232H810V274Z" fill="#FFFFFF" opacity="0.32"/>

  <!-- Hover overlay -->
  <rect x="810" y="232" width="440" height="216" fill="#111827" opacity="0.48"/>
  <rect x="888" y="306" width="138" height="48" rx="5" class="button"/>
  <text x="920" y="336" class="buttonText">重新上传</text>
  <rect x="1048" y="306" width="138" height="48" rx="5" class="button"/>
  <text x="1080" y="336" class="buttonText">重置位置</text>

  <text x="842" y="402" fill="#DDE4EF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">缩放</text>
  <line x1="894" y1="397" x2="1120" y2="397" stroke="#E5EAF3" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
  <line x1="894" y1="397" x2="1010" y2="397" stroke="#FFAC33" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1010" cy="397" r="11" fill="#FFFFFF"/>
  <text x="1136" y="402" fill="#E5EAF3" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">100%</text>

  <rect x="810" y="484" width="296" height="48" rx="8" fill="#FFFFFF" stroke="#DDE4EF" stroke-width="2"/>
  <text x="830" y="514" class="note">https://funnyfuzzy.com/...</text>
  <rect x="1106" y="484" width="118" height="48" rx="6" class="button"/>
  <text x="1128" y="514" class="buttonText">从链接获取</text>
  <rect x="1240" y="484" width="62" height="48" rx="6" class="button" transform="translate(-24 0)"/>
  <text x="1234" y="514" class="buttonText">粘贴</text>

  <text x="782" y="620" class="note">图片已存在时，编辑工具只在 hover 里出现</text>

  <!-- Bottom mini explanation -->
  <rect x="90" y="710" width="1220" height="54" rx="12" fill="#FFFFFF" stroke="#E5EAF3"/>
  <circle cx="124" cy="737" r="9" fill="#FFAC33"/>
  <text x="146" y="743" class="strong">建议：上传、链接获取、粘贴是高频入口；缩放、重置、重新上传是编辑态入口，默认收起。</text>
</svg>
